name: Tests

# Only checks the code. It never builds or publishes anything, and a red result here does not stop
# the Windows or the Android workflow: they are separate files that run on their own.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # GitHub's web upload never deletes files, so files removed from the project can stay in the repository.
      # The names are listed in old-files.txt; they are removed here, in the CI checkout only.
      - name: Remove leftovers from older versions
        run: sed -e 's/\r$//' -e '/^#/d' -e '/^$/d' old-files.txt | xargs -r rm -f --

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest pyyaml
      - run: python -m pytest -q

  # Advisory: a failure is shown as a warning, nothing else depends on it.
  go-engine:
    name: Go engine tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - run: go vet .
      - run: go test -count=1 .
