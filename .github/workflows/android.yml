name: Android APK

# Builds RoutePou-android.apk and publishes it as the Android download.
# Runs by itself after a push that changes the Android app, or from the Actions tab: Run workflow.
# Windows has its own file (windows.yml): the two never wait for each other.
on:
  push:
    branches: [main, master]
    paths:
      - '*.kt'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'android-*'
      - 'proguard-rules.pro'
      - 'stage-android.sh'
      - 'build-aar.sh'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'publish-release.sh'
      - 'release-notes.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the finished APK as the Android download (the latest release)'
        type: boolean
        default: true

permissions:
  contents: read

# A newer run waits for the running one; a running build (and its publishing) is never cancelled.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build:
    name: Build RoutePou-android.apk
    # A fixed image: "ubuntu-latest" moved to 26.04, which carries a different Android SDK setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROUTEPOU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ROUTEPOU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ROUTEPOU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # GitHub's web upload never deletes files, so files removed from the project can stay in the repository.
      # The names are listed in old-files.txt; they are removed here, in the CI checkout only.
      - name: Remove leftovers from older versions
        run: sed -e 's/\r$//' -e '/^#/d' -e '/^$/d' old-files.txt | xargs -r rm -f --

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      # The Ubuntu runner image already contains the Android SDK and its sdkmanager. The helper action
      # android-actions/setup-android@v3 is not used: it asks sdkmanager for a package called "tools"
      # that no longer exists, and stops the whole job with "Failed to find package 'tools'".
      - name: Install Android platform, build-tools and NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "sdkmanager: $SDKMANAGER"
          echo "SDK folder: $SDK"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/routepou-release.jks"
            echo "ROUTEPOU_KEYSTORE_FILE=$RUNNER_TEMP/routepou-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release-key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key (fine for testing; see README)."
          fi

      # Optional component: if the Go engine cannot be built, the APK is still produced
      # (proxy mode works) and the release notes say that Full Tunnel is missing.
      - name: Build Full Tunnel engine (relaywg.aar)
        id: aar
        continue-on-error: true
        run: bash build-aar.sh

      - name: Record engine status
        run: |
          if [ "${{ steps.aar.outcome }}" = "success" ]; then
            echo "FULL_TUNNEL=included" >> "$GITHUB_ENV"
          else
            echo "FULL_TUNNEL=missing" >> "$GITHUB_ENV"
            echo "::warning::relaywg.aar failed to build: this APK has NO Full Tunnel engine (proxy mode only). See the 'Build Full Tunnel engine' step log."
          fi

      - name: Stage Android project
        run: bash stage-android.sh

      - name: Build APKs
        working-directory: build/android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # When Gradle fails, the reason is copied to the top of the run page (Summary), so nobody has to scroll the log.
      - name: Show why the Android build failed
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle.log"
          [ -f "$log" ] || exit 0
          {
            echo '### Android build failed. The important lines:'
            echo '```'
            grep -nE "^e: |error:|What went wrong|Execution failed|Could not |Unresolved reference|file name must end|AAPT|Duplicate class" "$log" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong" -A2 "$log" | head -12 | while IFS= read -r line; do echo "::error::${line}"; done

      # If Gradle fails, keep its reports so the cause can be read without scrolling the raw log.
      - name: Keep Gradle reports (only when the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/android/build/reports
            build/android/build/outputs/logs

      - name: Verify and name APKs
        run: |
          set -euo pipefail
          out=build/android/build/outputs/apk
          rel="$(ls "$out"/release/*.apk | head -n1)"
          dbg="$(ls "$out"/debug/*.apk | head -n1)"
          test -s "$rel"; test -s "$dbg"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$rel"
          mkdir -p dist
          cp "$rel" "dist/RoutePou-android.apk"
          cp "$dbg" "dist/RoutePou-android-debug.apk"
          { echo "android_signing=${SIGNING}"; echo "android_full_tunnel=${FULL_TUNNEL}"; } > dist/info-android.txt
          ls -lh dist
          { echo "### Android"; echo "- Full Tunnel engine: **${FULL_TUNNEL}**"; echo "- Signing: **${SIGNING}**"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: RoutePou-Android
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.apk
            dist/info-android.txt

  publish:
    name: Publish the Android download
    needs: build
    # After a push to main/master, or after Run workflow with "publish" ticked.
    if: ${{ success() && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RoutePou-Android
          path: artifacts
      - run: rm -f artifacts/RoutePou-android-debug.apk   # the debug build stays in the workflow artifact only
      - run: bash publish-release.sh artifacts/RoutePou-android.apk
