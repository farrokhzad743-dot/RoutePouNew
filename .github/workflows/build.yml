name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  # "Run workflow" button (Actions tab): builds everything and, if the box is ticked, publishes the downloads.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the finished builds as the public download (the "latest" release)'
        type: boolean
        default: true

permissions:
  contents: read

# A newer push cancels an older push build. A manual run is never cancelled by a push.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  # ------------------------------------------------------------------ Python tests
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # GitHub's web upload never deletes files, so files removed from the project (the old web app, the
      # old tests, an old workflow copy) can stay in the repository and break the tests or the build.
      # They are removed here, in the CI checkout only. Delete them from the repository too, see PUBLISHING.md.
      - name: Remove leftovers from older versions
        run: |
          rm -f test_pwa.py app.js app.css strings.js sw.js manifest.webmanifest \
                icon-512.png icon-maskable-512.png btn-web.png \
                Estedad-Regular.woff2 Estedad-Medium.woff2 Estedad-Bold.woff2 Estedad-ExtraBold.woff2 \
                Inter-Regular.woff Inter-SemiBold.woff Inter-Bold.woff Inter-ExtraBold.woff \
                .github/workflows/build.xml res/drawable-nodpi/none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest pyyaml
      - run: python -m pytest -q

  # ------------------------------------------------------------ Go engine tests
  # Advisory: a failure here is shown as a warning but does not stop the APK/EXE builds.
  go-engine:
    name: Go engine tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - run: go vet .
      - run: go test -count=1 .

  # ---------------------------------------------------------------------- Android
  android:
    name: Android APK
    # A fixed image: "ubuntu-latest" moved to 26.04, which carries a different Android SDK setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROUTEPOU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ROUTEPOU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ROUTEPOU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # GitHub's web upload never deletes files, so files removed from the project (the old web app, the
      # old tests, an old workflow copy) can stay in the repository and break the tests or the build.
      # They are removed here, in the CI checkout only. Delete them from the repository too, see PUBLISHING.md.
      - name: Remove leftovers from older versions
        run: |
          rm -f test_pwa.py app.js app.css strings.js sw.js manifest.webmanifest \
                icon-512.png icon-maskable-512.png btn-web.png \
                Estedad-Regular.woff2 Estedad-Medium.woff2 Estedad-Bold.woff2 Estedad-ExtraBold.woff2 \
                Inter-Regular.woff Inter-SemiBold.woff Inter-Bold.woff Inter-ExtraBold.woff \
                .github/workflows/build.xml res/drawable-nodpi/none

      - name: Read version
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      # The Ubuntu runner image already contains the Android SDK and its sdkmanager. The helper action
      # android-actions/setup-android@v3 is not used: it asks sdkmanager for a package called "tools"
      # that no longer exists, and stops the whole job with "Failed to find package 'tools'".
      - name: Install Android platform, build-tools and NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "sdkmanager: $SDKMANAGER"
          echo "SDK folder: $SDK"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/routepou-release.jks"
            echo "ROUTEPOU_KEYSTORE_FILE=$RUNNER_TEMP/routepou-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release-key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key (fine for testing; see README)."
          fi

      # Optional component: if the Go engine cannot be built, the APK is still produced
      # (proxy mode works) and the release notes say that Full Tunnel is missing.
      - name: Build Full Tunnel engine (relaywg.aar)
        id: aar
        continue-on-error: true
        run: bash build-aar.sh

      - name: Record engine status
        run: |
          if [ "${{ steps.aar.outcome }}" = "success" ]; then
            echo "FULL_TUNNEL=included" >> "$GITHUB_ENV"
          else
            echo "FULL_TUNNEL=missing" >> "$GITHUB_ENV"
            echo "::warning::relaywg.aar failed to build: this APK has NO Full Tunnel engine (proxy mode only). See the 'Build Full Tunnel engine' step log."
          fi

      - name: Stage Android project
        run: bash stage-android.sh

      - name: Build APKs
        working-directory: build/android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # When Gradle fails, the reason is copied to the top of the run page (Summary), so nobody has to scroll the log.
      - name: Show why the Android build failed
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle.log"
          [ -f "$log" ] || exit 0
          {
            echo '### Android build failed. The important lines:'
            echo '```'
            grep -nE "^e: |error:|What went wrong|Execution failed|Could not |Unresolved reference|file name must end|AAPT|Duplicate class" "$log" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong" -A2 "$log" | head -12 | while IFS= read -r line; do echo "::error::${line}"; done

      # If Gradle fails, keep its reports so the cause can be read without scrolling the raw log.
      - name: Keep Gradle reports (only when the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/android/build/reports
            build/android/build/outputs/logs

      - name: Verify and name APKs
        run: |
          set -euo pipefail
          out=build/android/build/outputs/apk
          rel="$(ls "$out"/release/*.apk | head -n1)"
          dbg="$(ls "$out"/debug/*.apk | head -n1)"
          test -s "$rel"; test -s "$dbg"
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$rel"
          mkdir -p dist
          cp "$rel" "dist/RoutePou-android.apk"
          cp "$dbg" "dist/RoutePou-android-debug.apk"
          { echo "android_signing=${SIGNING}"; echo "android_full_tunnel=${FULL_TUNNEL}"; } > dist/info-android.txt
          ls -lh dist
          { echo "### Android"; echo "- Full Tunnel engine: **${FULL_TUNNEL}**"; echo "- Signing: **${SIGNING}**"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: RoutePou-Android
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.apk
            dist/info-android.txt

  # ---------------------------------------------------------------------- Windows
  windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyinstaller zxing-cpp pillow opencv-python

      - name: Check the app's modules import
        run: python -c "import pairing, wg_provision, wg_supervisor, proxy_headers, cv2, zxingcpp, PIL, tkinter, tkinter.ttk, winreg; print('imports ok')"

      - name: Test the WireGuard worker (advisory)
        continue-on-error: true
        run: go test ./winclient

      # Optional component: without the worker the EXE still runs in proxy mode.
      - name: Build the WireGuard worker (relaywg-client.exe)
        continue-on-error: true
        shell: pwsh
        run: |
          go build -trimpath -ldflags="-s -w" -o relaywg-client.exe ./winclient
          if (-not (Test-Path relaywg-client.exe)) { throw 'relaywg-client.exe was not produced' }

      - name: Download Wintun runtime
        id: wintun
        continue-on-error: true
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          Write-Host ("wintun-0.14.1.zip SHA-256: " + (Get-FileHash $zip -Algorithm SHA256).Hash)
          $dir = Join-Path $env:RUNNER_TEMP 'wintun'
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem $dir -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match '[\\/]amd64[\\/]' } | Select-Object -First 1
          if (-not $dll) { throw 'amd64 wintun.dll not found in the Wintun archive' }
          Copy-Item $dll.FullName wintun.dll

      - name: Build RoutePou.exe
        shell: pwsh
        run: |
          $full = ((Test-Path relaywg-client.exe) -and (Test-Path wintun.dll))
          $a = @('--noconfirm', '--clean', '--onefile', '--windowed', '--icon', 'routepou.ico',
                 '--collect-all', 'zxingcpp', '--collect-all', 'PIL', '--collect-all', 'cv2',
                 # tkinter.ttk is also imported with a plain import in routepou_windows.py. Declared here as well, because an
                 # EXE without it stops at start-up with "No module named 'tkinter.ttk'".
                 '--hidden-import', 'tkinter.ttk', '--name', 'RoutePou')
          if ($full) { $a += @('--add-binary', 'relaywg-client.exe;.', '--add-binary', 'wintun.dll;.') }
          else { Write-Host '::warning::Worker or Wintun missing: building proxy-mode-only EXE.' }
          $a += 'routepou_windows.py'
          pyinstaller @a
          if ($LASTEXITCODE -ne 0) { throw 'pyinstaller failed' }
          # The EXE must contain tkinter.ttk, otherwise it fails when started (a window appears only on the user's PC).
          $toc = Get-ChildItem build\RoutePou -Filter *.toc -ErrorAction SilentlyContinue
          if ($toc) {
            if (-not (Select-String -Path $toc.FullName -Pattern 'tkinter.ttk' -Quiet)) { throw 'tkinter.ttk is missing from the EXE' }
          } else { Write-Host '::warning::PyInstaller table-of-contents files not found; skipped the tkinter.ttk check.' }
          $exe = Get-Item dist\RoutePou.exe
          if ($exe.Length -lt 5MB) { throw "RoutePou.exe is suspiciously small ($($exe.Length) bytes)" }
          New-Item -ItemType Directory -Force dist-out | Out-Null
          Copy-Item $exe.FullName "dist-out\RoutePou-windows-x64.exe"
          $state = if ($full) { 'included' } else { 'missing' }
          "windows_full_tunnel=$state" | Out-File dist-out\info-windows.txt -Encoding ascii
          "### Windows`n- Full Tunnel worker: **$state**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-ChildItem dist-out | Format-Table Name, Length

      # Start the finished EXE once, the way a user would. The window opens for a moment and closes again; exit code 0
      # means that every module the program needs is inside the EXE. This is the check that would have caught the
      # "No module named 'tkinter.ttk'" error before anyone downloaded the file.
      - name: Start the finished EXE once (self-test)
        shell: pwsh
        run: |
          python -c "import tkinter; r = tkinter.Tk(); r.destroy()"
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::This runner cannot open a window, so the EXE start test was skipped.'
            "- EXE start test: **skipped** (the runner cannot open windows)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          $p = Start-Process -FilePath (Resolve-Path dist-out\RoutePou-windows-x64.exe).Path -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(60000)) {
            $p.Kill()
            throw 'The EXE did not close within 60 seconds. It probably showed an error window instead of starting.'
          }
          $report = Join-Path ([IO.Path]::GetTempPath()) 'routepou-selftest.txt'
          if (Test-Path $report) { Get-Content $report | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 0) { throw "The EXE stopped with exit code $($p.ExitCode) when it was started." }
          Write-Host 'The EXE started and closed normally.'
          "- EXE start test: **passed** (the finished RoutePou.exe opened its window and closed normally)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: RoutePou-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            dist-out/*.exe
            dist-out/info-windows.txt

  # ---------------------------------------------------------------------- Release
  release:
    name: Publish GitHub Release
    # Runs for a version tag, or for a manual run with "publish" ticked. The Windows build gates the release.
    # A failed Android build does not hold the Windows download back: the release is still published, with a
    # warning, and says so in its notes. A failed test run is shown as a warning, it does not block the download.
    if: ${{ !cancelled() && needs.windows.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    needs: [python-tests, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the VERSION file (v${version})."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          if [ "${{ needs.python-tests.result }}" != "success" ]; then
            echo "::warning::The Python tests did not pass. The release is still published; open the Python tests job to see why."
          fi

      # A manual run publishes from a branch: move the version tag to this exact commit, so the release,
      # its source archive and the files attached to it all describe the same build.
      - name: Point the version tag at this commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -f "v${VERSION}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/v${VERSION}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd artifacts
          rm -f ./*-debug.apk                       # debug builds stay workflow-only
          grep -h . info-*.txt
          sha256sum RoutePou-* > SHA256SUMS.txt
          cd ..
          awk -v v="## ${VERSION}" 'index($0, v)==1 {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          # The Android job can be missing (it failed): read its info file only if it exists.
          ft_android="$(grep -hs android_full_tunnel artifacts/info-android.txt | cut -d= -f2 || true)"
          ft_windows="$(grep -hs windows_full_tunnel artifacts/info-windows.txt | cut -d= -f2 || true)"
          signing="$(grep -hs android_signing artifacts/info-android.txt | cut -d= -f2 || true)"
          if [ -f artifacts/RoutePou-android.apk ]; then
            android_line="- **Android:** \`RoutePou-android.apk\` (Android 8.0+)"
          else
            android_line="- **Android:** not included in this release because the Android build failed. See the workflow run."
            echo "::warning::The Android APK is missing from this release (the Android job failed)."
          fi
          {
            echo
            echo "### Downloads"
            echo "${android_line}"
            echo "- **Windows:** \`RoutePou-windows-x64.exe\` (Windows 10/11, 64-bit)"
            echo "- Phone and PC must be on the same network (one Wi-Fi, or the phone's hotspot)."
            echo "- Verify with \`SHA256SUMS.txt\`."
            echo
            echo "### Build details"
            echo "- Full Tunnel engine — Android: ${ft_android}, Windows: ${ft_windows}"
            echo "- Android signing: ${signing}"
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: RoutePou ${{ env.VERSION }}
          body_path: notes.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/RoutePou-*
            artifacts/SHA256SUMS.txt
